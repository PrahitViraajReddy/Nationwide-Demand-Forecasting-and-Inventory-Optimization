project:
  name: nationwide-demand-forecasting-and-inventory-optimization
  random_seed: 42
  timezone: UTC

paths:
  raw_data: data/raw/m5
  processed_data: data/processed
  artifacts: artifacts

forecasting:
  horizon_days: 28
  validation_days: 28
  seasonal_period: 7
  development_series_limit: 100
  metrics:
    - WAPE
    - RMSSE

inventory:
  lead_time_days: 7
  review_period_days: 7
  holding_cost_per_unit: 0.01
  stockout_cost_per_unit: 1.0
  max_order_quantity: null
  order_multiple: 1
  # Deterministic cost model only; values are illustrative assumptions, not M5 fields.
