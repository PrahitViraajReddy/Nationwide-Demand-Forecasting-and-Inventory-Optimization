[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nationwide-demand-inventory"
version = "0.1.0"
description = "Retail demand forecasting and inventory optimization"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6.0",
  "prophet>=1.1.5",
  "lightgbm>=4.3",
  "u8darts[torch]>=0.30",
  "pytorch-forecasting>=1.0",
  "ortools>=9.8",
  "plotly>=5.20",
  "dash>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
